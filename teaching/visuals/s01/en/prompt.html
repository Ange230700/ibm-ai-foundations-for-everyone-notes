<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f3f3;
      color: #122b4a;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .banner {
      background: #122b4a;
      color: white;
      padding: 18px 24px;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 700;
    }

    .stamp {
      display: inline-block;
      background: #fff0ce;
      color: #684900;
      border: 2px solid #c29a26;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 21px;
      font-weight: 700;
      margin: 15px 0;
    }

    .card {
      background: white;
      border: 2px solid #b9ced8;
      border-radius: 18px;
      padding: 16px 22px;
      margin-bottom: 12px;
      line-height: 1.26;
    }

    .card h2 {
      font-size: 21px;
      margin: 0 0 10px;
      color: #007da0;
    }

    .card p {
      font-size: 21px;
      margin: 0;
    }

    .warning {
      border-color: #d48e18;
      background: #fffaf0;
    }

    .warning h2 {
      color: #965800;
    }

    .footer {
      font-size: 17px;
      color: #445977;
      line-height: 1.3;
      margin-top: 12px;
    }
  </style>
  <div class="banner">Writing a clear prompt</div>
  <div class="stamp">Teaching simulation — illustrative prompt</div>
  <section class="card">
    <h2>Prompt to AI</h2>
    <p>
      Write a 70-word note to staff at a fictional cocoa cooperative. Goal: remind them to complete
      weighing records. Use clear language. Do not invent dates or quantities.
    </p>
  </section>
</html>
