sonar.projectKey=Ange230700_ibm-ai-foundations-for-everyone-notes
sonar.organization=ange230700

sonar.projectName=ibm-ai-foundations-for-everyone-notes

sonar.exclusions=packages/*/test/**,**/node_modules/**,coverage/**,.artifacts/**


sonar.javascript.lcov.reportPaths=coverage/lcov.info

# scripts/ are quality-analyzed but are intentionally outside the c8 coverage scope.
sonar.coverage.exclusions=scripts/**

sonar.sourceEncoding=UTF-8

# Teaching jobs run sequentially to serialize Office automation, limit rendering
# resource usage, and stop subsequent jobs when an earlier job fails.
sonar.issue.ignore.multicriteria=teaching-sequential,visual-rendering,contact-sheet-sequential,pdf-page-rendering,mermaid-rendering,artifact-sequential
sonar.issue.ignore.multicriteria.teaching-sequential.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.teaching-sequential.resourceKey=packages/cli/src/teaching-artifact.ts

# Render one asset at a time to bound browser resource usage and ensure
# rendering has stopped before the shared browser is closed.
sonar.issue.ignore.multicriteria.visual-rendering.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.visual-rendering.resourceKey=scripts/lib/generate-teaching-visuals.mjs

# Process contact sheets sequentially to bound image and canvas memory.
# Images within each sheet are already loaded concurrently.
sonar.issue.ignore.multicriteria.contact-sheet-sequential.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.contact-sheet-sequential.resourceKey=packages/presentations/src/document/contact-sheet.ts


# Render, encode, and write one PDF page at a time to bound canvas memory.
# Each page and canvas is cleaned up before processing the next page.
sonar.issue.ignore.multicriteria.pdf-page-rendering.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.pdf-page-rendering.resourceKey=packages/presentations/src/document/render-pdf-pages.ts


# Render diagrams sequentially to bound browser workload and serialize cache writes.
sonar.issue.ignore.multicriteria.mermaid-rendering.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.mermaid-rendering.resourceKey=packages/presentations/src/mermaid/render.ts

# Process artifact targets sequentially to bound resource use,
# preserve ordered progress, and stop before later targets on failure.
sonar.issue.ignore.multicriteria.artifact-sequential.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.artifact-sequential.resourceKey=packages/cli/src/artifact.ts
